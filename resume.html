## 소개
현장의 문제를 흐름과 구조로 풀어, 운영 가능한 AI로 만드는 엔지니어입니다.

창업과 외식업 운영, 프랜차이즈 현장에서 고객 경험, 피크타임 병목, 서비스 표준, 인력 운영 문제를 직접 다뤘습니다. 지금은 그 경험에서 익힌 문제 구조화 방식과 운영 감각을 AI Agent, AI Product, AI Research 프로젝트에 적용하고 있습니다.

## 핵심 강점
- 상태, 분기, fallback, tracing을 포함한 운영형 AI 구조 이해
- 사용자 문제와 운영 병목을 기능 흐름으로 나누는 문제 정의 능력
- 실행, 채점, 분석을 분리한 평가 구조와 결과 자산화
- 코드, 문서, 운영 기준을 함께 남기는 협업 방식

## 대표 프로젝트

### POMMIT
- `company_analyzer`의 `service_agent` 흐름을 중심으로 HTML 정리, 텍스트 정제, 단어 빈도 추출, collector 전달 구조를 문서와 코드 기준으로 정리했습니다.
- `cleaned_documents`, `service_word_frequencies` 같은 상태 필드를 기준으로 최소기능을 정리했고, 이후 HybridRAG와 NLP 전처리 강화 방향은 연구 메모와 설계 문서 수준에서 검토·문서화했습니다.

### LGEA
- `LUMI`의 FastAPI와 내부 service surface를 같은 질문 세트로 반복 실행하고, 결과를 채점·분석·보고서로 남기는 평가 워크스페이스를 다뤘습니다.
- 특히 persona와 abuse category에 따라 모델의 guardrail이 어느 표면에서 더 쉽게 무너지는지 비교하는 실험 구조를 정리했습니다.

### trade-onboarding-agent
- 무역 실무 온보딩 미니프로젝트에서 `RAG`와 `riskmanaging agent` 흐름을 중심으로 작업했습니다.
- 무역 도메인 데이터 ingest, ChromaDB 기반 검색 구조, riskmanaging agent 문서와 백엔드 흐름을 정리하고, 리스크 질문을 RAG 근거와 함께 응답하는 구조를 다뤘습니다.

### poketdogam
- `chat`, `scan`, `pokedex` 라우트를 나눠 사용자 질문, 이미지 스캔, 도감 조회 흐름을 분리했습니다.
- `입력 수집 -> OCR/후보 확인 -> 문맥 검색 -> 응답 생성 -> trace 저장` 구조와 fallback 방향을 설계해 멀티모달 사용자 경험을 다뤘습니다.

### LUMI
- 청년취업사관학교 교육과정 안에서, 상태 유지, fallback, 비용 추적, tracing까지 포함한 운영형 AI 서비스 구조를 학습하고 구현한 프로젝트입니다.
- LangGraph 기반 상태 흐름, checkpointer, token/cost tracking, 저장소 분리 구조를 통해 서비스 본체와 평가 레이어를 분리해 설명할 수 있는 기반을 만들었습니다.
