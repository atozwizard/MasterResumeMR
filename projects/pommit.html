# POMMIT 포트폴리오

## Slide 1. 프리뷰

### 한 줄 설명
해커톤 기반 팀 `POMMIT`에서 `company_analyzer`의 기업 분석 축을 맡아, service_agent 최소기능과 운영 문서를 정리하고 `NLP 전처리 -> HybridRAG` 확장 방향을 검토·문서화한 협업 프로젝트

### 핵심 메시지
이 프로젝트에서 저는 `협업을 경험한 사람`이 아니라, `여러 에이전트가 얽힌 프로젝트에서 흐름과 기준을 먼저 세우고 NLP 처리 방향까지 잡는 사람`으로 기여했습니다.

### 내 역할 요약
- `service_agent` 최소기능 방향 설계와 구현 정리
- HTML 정리 -> 텍스트 정제 -> 단어 빈도 추출 -> collector 전달 흐름 구체화
- 상태 스키마, 문서 구조, 마일스톤 운영 기준 정리
- 이후 HybridRAG, NLP 전처리, sparse data 보강 방향 검토 및 문서화

---

## Slide 2. 왜 이 프로젝트가 중요했는가

### 문제
`company_analyzer`는 GitHub, JD, 기술 블로그, 서비스 설명문을 함께 다루는 구조라서, 기능을 빨리 붙이는 것만으로는 프로젝트가 앞으로 나가지 않았습니다. 각 에이전트가 무엇을 받고 무엇을 넘기는지, 어떤 산출물을 남기는지, 팀이 어떤 기준으로 작업을 관리할지가 먼저 잡혀야 했고, 서비스 설명문에서 요구역량을 어떻게 추출할지도 함께 정리돼야 했습니다.

### 해결하지 않으면 생기는 결과
- 구현은 늘어나도 입력과 출력 계약이 맞지 않아 다음 단계로 연결되지 않습니다.
- 협업 기준이 흔들려 팀 산출물이 약해집니다.
- 서비스 설명문 처리도 임시 로직에 머물러, 이후 요구역량 추출과 HybridRAG 확장으로 이어지기 어렵습니다.

```mermaid
flowchart LR
    A[여러 에이전트가 동시에 개발됨] --> B[입출력 계약 불명확]
    B --> C[결과물 연결 약화]
    C --> D[요구역량 추출 품질 흔들림]
    D --> E[협업 비용 증가]
```

## Slide 3. 내가 맡은 기여

### 실제로 맡은 부분
- `company/service_agent`를 기준으로 서비스 설명문 처리 축을 정리했습니다.
- `html_cleanup_node.py`에서 HTML 태그를 걷어내고 의미 있는 텍스트만 남기는 흐름을 잡았습니다.
- `word_frequency_node.py`에서 정리된 문서를 받아 불용어를 제거하고 단어 빈도를 세어 `service_evidences` 형태로 collector가 받을 수 있게 만들었습니다.
- `ServiceAgentState`에 `cleaned_documents`, `service_word_frequencies` 같은 필드를 두고, 파일 저장보다 객체 전달이 우선되도록 상태 흐름을 정리했습니다.
- `plan-service-collector-mvp`, 마일스톤 운영 가이드, 프로젝트 루트 구조 가이드를 정리해 팀이 같은 기준으로 움직이게 했습니다.

### 기여의 성격
- 단순 기능 추가가 아니라, `다음 에이전트가 이어서 쓸 수 있는 형태`로 결과를 만드는 데 초점을 뒀습니다.
- 코드와 문서가 따로 놀지 않도록, 구현과 동시에 운영 기준도 같이 정리했습니다.

```mermaid
flowchart TB
    A[내가 다룬 축] --> B[service_agent 처리 흐름]
    A --> C[상태 스키마 정리]
    A --> D[마일스톤 / 브랜치 / 디렉토리 운영 문서]
    A --> E[NLP 전처리 / HybridRAG 확장 설계]
    B --> F[HTML 정리]
    B --> G[텍스트 정제]
    B --> H[단어 빈도 추출]
    B --> I[collector 전달 형식 정리]
```

## Slide 4. NLP 전처리 관점에서 무엇을 했는가

### 왜 이 단계가 NLP 처리의 시작인가
서비스 설명문에서 요구역량을 뽑아내려면, 원문 HTML을 그대로 넘기는 것보다 먼저 문서 노이즈를 제거하고, 의미 있는 텍스트만 남기고, 최소 단위의 토큰/단어 수준 신호를 정리해야 합니다. 저는 이 출발점을 `service_agent` 안에 두었습니다.

### 실제 처리 흐름
1. 서비스 설명문 HTML을 읽습니다.
2. `script`, `style`, 태그를 제거해 텍스트만 남깁니다.
3. 정리된 텍스트를 `cleaned_documents`에 객체 형태로 담습니다.
4. 텍스트에서 불용어를 제외하고 단어 빈도를 계산합니다.
5. 결과를 `service_word_frequencies`와 `service_evidences`로 만들어 collector가 이어서 합칠 수 있게 넘깁니다.

```mermaid
flowchart LR
    A[서비스 HTML 입력] --> B[html_cleanup_node]
    B --> C[cleaned_documents 생성]
    C --> D[word_frequency_node]
    D --> E[불용어 제외 / 단어 빈도 계산]
    E --> F[service_evidences 변환]
    F --> G[collector_agent 전달]
```

### 이 장에서 강조할 점
- 지금 구현은 형태소 분석 전체가 아니라, `전처리와 근거 신호 정리`의 시작점입니다.
- 이 단계가 있어야 이후 형태소 분석기 도입이나 HybridRAG가 설명 가능한 구조로 붙습니다.

## Slide 5. 왜 HybridRAG와 확장 연구가 필요한가

### 단어 빈도만으로 부족한 이유
서비스 설명문에서 중요한 요구역량은 적게 등장할 수도 있고, 서로 떨어져 있는 문장 관계 안에서 의미가 생길 수도 있습니다. 단순 빈도만으로는 이런 맥락을 복원하기 어렵습니다.

### 그래서 다음 단계로 본 것
- `HybridRAG`
  - 텍스트 유사도만이 아니라 관계 구조도 함께 보며 요구역량을 복원하는 방식을 검토
- `NLP 전처리 강화`
  - 현재는 불용어 제거와 단어 빈도 중심 최소기능이지만, 이후 `Kiwi` 같은 형태소 분석기 도입도 검토
- `sparse data 보강`
  - 데이터가 적은 상황에서도 관계를 잇기 위한 virtual edge, ExpandRank, 유사도 보정 방향 검토

```mermaid
flowchart LR
    A[현재 MVP]
    A --> B[HTML 정리]
    A --> C[텍스트 정제 / 단어 빈도]
    C --> D[collector 연동]
    D --> E[요구역량 추출 기반]
    E --> F[HybridRAG 확장]
    E --> G[형태소 분석기 검토]
    E --> H[sparse data 보강]
```

## Slide 6. 협업 구조와 운영 기준

### 왜 운영 문서를 같이 정리했는가
에이전트 프로젝트는 코드보다 먼저 `같은 기준으로 일하는 방식`이 무너지기 쉽습니다. 그래서 기능 구현과 함께, 마일스톤 이름을 목표 중심으로 통일하고, 브랜치 운영 규칙과 디렉토리 구조를 정리하는 문서를 같이 만들었습니다.

### 실제로 정리한 것
- `가이드-마일스톤-운영.md`
  - milestone 이름을 기능명이 아니라 목표 상태 중심으로 정리
- `가이드-프로젝트-루트-디렉토리-구조.md`
  - 코드, 입력, 출력, 테스트 위치를 분리
- `service_agent` 관련 계획 문서
  - issue 단위 구현과 collector 연동 범위를 먼저 문서로 정리

---

## Slide 7. 결과와 이 프로젝트가 보여주는 것

### 현재까지 나온 결과
- 최근 커밋 기준으로 `service_agent`와 `collector_agent`를 잇는 단어 빈도 최소기능이 반영됐습니다.
- 상태 스키마와 객체 전달 흐름이 정리되면서, 이후 에이전트 연결을 더 설명 가능하게 다룰 수 있는 기반이 생겼습니다.
- 운영 문서가 함께 정리되어 팀 프로젝트 안에서 제 기여가 `코드 한 조각`이 아니라 `흐름과 처리 기준을 세운 역할`로 남습니다.

### 이 프로젝트가 보여주는 것
- 저는 팀 프로젝트에서 막연히 참여하는 사람이 아니라, 먼저 기준과 흐름을 세운 뒤 구현을 붙이는 방식으로 일합니다.
- NLP 전처리의 시작점과 HybridRAG 확장 방향을 같은 맥락 안에서 검토하고 문서화할 수 있습니다.
- 구현된 것과 아직 연구/설계 단계인 것을 구분해 관리합니다.

### 한 줄 정리
`POMMIT`는 제게 협업 경험 그 자체보다, 복잡한 에이전트 프로젝트 안에서 `구조를 먼저 세우고 NLP 처리 방향과 다음 실험 방향까지 정리하는 사람`이라는 점을 보여주는 프로젝트입니다.
