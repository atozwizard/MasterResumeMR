# poketdogam 포트폴리오

## Slide 1. 프리뷰

### 한 줄 설명
텍스트 질의와 이미지 스캔이 하나의 제품 경험으로 이어지도록 설계한 멀티모달 도감형 AI 서비스 프로젝트

### 핵심 메시지
이 프로젝트의 중심은 기능 나열이 아니라, `스캔 실패까지 포함해 사용자 경험이 끊기지 않는 흐름`을 만드는 일이었습니다.

### 내 역할 요약
- FastAPI 라우트 분리 설계
- 스캔 흐름과 OCR fallback 구조 설계
- trace, observability, GraphRAG 방향 설계

---

## Slide 2. 왜 이 프로젝트가 필요했는가

### 문제
사용자가 정보를 찾는 흐름은 보통 검색, 이미지 확인, 상세 조회가 따로 놀기 쉽습니다. 특히 이미지 입력은 OCR 실패, 후보 매핑, 모델 오류 대응까지 함께 고려해야 실제 서비스로 이어질 수 있습니다.

### 해결하지 않으면 생기는 결과
- 검색과 스캔이 분리되어 사용자 경험이 끊깁니다.
- OCR 실패 시 서비스가 바로 무너집니다.
- 왜 이 결과가 나왔는지 추적하기 어렵습니다.

```mermaid
journey
    title 포켓몬 탐색 사용 경험
    section 기존 방식
      텍스트 검색: 3: 사용자
      이미지 따로 확인: 2: 사용자
      상세조회 따로 이동: 2: 사용자
    section 목표 방식
      질문 입력: 4: 사용자
      이미지 스캔: 4: 사용자
      상세 정보 연결: 5: 사용자
      결과 추적 가능: 5: 사용자
```

---

## Slide 3. 무엇을 구현했는가

### 현재 구현된 구조
- FastAPI 라우트
  - `chat`
  - `scan`
  - `pokedex`
- `PokedexAgentGraph` 기준 처리 흐름
  - 입력 수집
  - 위치/후보 감지
  - 문맥 검색
  - 응답 생성
  - trace 저장
- 설계 문서 기준 기술 조합
  - `LiteLLM`
  - `Upstage OCR`
  - `Supabase pgvector`
  - `Graph DB`
  - `Langfuse`

```mermaid
flowchart LR
    A[chat route] --> D[질문 처리]
    B[scan route] --> E[이미지 스캔 처리]
    C[pokedex route] --> F[도감 상세 조회]
    D --> G[공통 응답 레이어]
    E --> G
    F --> G
```

### 이 장에서 구분할 점
- 라우트 구조와 기본 처리 흐름은 현재 구현 근거가 있습니다.
- GraphRAG, observability, 외부 연동 전체 완성도는 아직 확장 설계와 검증이 더 필요합니다.

---

## Slide 4. 어떻게 실패를 다뤘는가

### 스캔 쪽 핵심 구조
1. 이미지를 받습니다.
2. OCR을 실행합니다.
3. 결과가 확실하면 문맥 검색으로 넘깁니다.
4. 애매하면 후보 확인 단계로 보냅니다.
5. 그래도 불확실하면 fallback 경로로 넘깁니다.
6. 최종 응답과 trace를 남깁니다.

```mermaid
flowchart LR
    A[이미지 입력] --> B[OCR 실행]
    B --> C{결과 확실한가?}
    C -->|예| D[문맥 검색]
    C -->|아니오| E[후보 확인]
    E --> F[Fallback 경로]
    D --> G[응답 생성]
    F --> G
    G --> H[trace 저장]
```

### 왜 이 구조가 중요한가
- 이 프로젝트의 강점은 OCR을 붙였다는 사실보다, `실패를 전제로 사용자 흐름을 설계했다`는 점입니다.

- 라우트 분리 설계
- `PokedexAgentGraph` 기준 흐름 정리

### 여기서 보여주는 점
- 이 프로젝트는 단순 아이디어 메모가 아니라, 라우트와 에이전트 흐름, 설계 문서가 함께 남아 있는 산출물입니다.

## Slide 6. 구현된 것과 남은 것

### 현재 설명 가능한 것
- 라우트 분리 구조
- 멀티모달 사용자 흐름
- OCR fallback 방향
- trace / observability 고려 구조

### 아직 더 필요한 것
- 실제 외부 연동 완성도 검증
- OCR 품질과 fallback 동작 검증
- 도감 상세 조회 데이터 연결 보강
- GraphRAG의 실제 성능 검증

### 왜 이 구분이 중요한가
- 이 프로젝트는 `구현된 구조`와 `확장 설계`를 같이 보여주는 문서여야 신뢰가 생깁니다.

## Slide 7. 결과와 이 프로젝트가 보여주는 것

### 결과
- 단순 검색 데모가 아니라 제품 경험 중심의 멀티모달 AI 구조를 만들었습니다.
- AI 기능을 사용자 경험으로 번역하는 프로젝트로 설명할 수 있습니다.
- 실패 가능성이 높은 OCR 흐름을 서비스 구조 관점에서 다룬 근거가 남아 있습니다.

### 이 프로젝트가 보여주는 역량
- AI Product Engineer 관점
  - 사용자 경험과 서비스 흐름 설계
- AI Agent Engineer 관점
  - 라우트, 그래프, fallback, trace 구조 설계
- 공통
  - 구현된 것과 남은 것을 구분해 설명하는 태도

### 한 줄 정리
저는 이 프로젝트에서 OCR을 붙이는 것보다, `실패해도 사용자 경험이 끊기지 않는 멀티모달 흐름`을 먼저 만들었습니다.
