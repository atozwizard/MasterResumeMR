업무상 강점
저의 핵심 강점은 문제를 단계와 기준으로 다시 나누는 능력입니다. 저는 기능을 빨리 하나 더 붙이는 방식보다, 먼저 어디서 흐름이 끊기는지, 어떤 조건에서 판단이 갈리는지, 무엇을 남겨야 다시 비교하고 고칠 수 있는지부터 보는 편입니다. 이 방식은 AI를 공부한 뒤에 갑자기 생긴 것이 아니라, 창업과 외식업 운영, 프랜차이즈 현장에서 먼저 만들어졌습니다. 커피소녀오즈에서는 고객이 왜 다시 찾는지에 맞춰 메뉴와 공급 전략을 바꿨고, 우동오즈와 쿤타치에서는 점심 피크타임에 주문, 조리, 토핑, 서빙 흐름이 어디서 막히는지 계속 봤습니다. 리틀방콕 중계그린점에서는 `25평` 규모 매장에서 HR, 근태, 홀 교육, CS 운영을 맡으며 서비스 표준과 현장 실행의 차이를 몸으로 배웠습니다.

이 관점은 AI 프로젝트에서도 그대로 드러났습니다. `trade-onboarding-agent`에서는 사용자의 입력이 들어오면 먼저 `conversation_history`와 `active_agent`를 읽고, `context.mode`가 있으면 그 값을 우선 반영하고, 없으면 키워드와 이전 대화 상태를 기준으로 어떤 에이전트로 보낼지 나눴습니다. 그래도 모호한 경우에만 LLM 분류를 태웠고, 마지막에는 응답 형식을 다시 정리해 프론트에서 바로 사용할 수 있게 했습니다. `LGEA`에서는 실행, 채점, 분석 단계를 분리하고 baseline, persona, scored result, analysis summary를 파일로 남겨 같은 조건으로 다시 돌리고 비교할 수 있게 했습니다. `poketdogam`에서는 `chat`, `scan`, `pokedex` 흐름을 나누고 스캔 쪽에 `입력 수집 -≫ OCR/후보 확인 -≫ 문맥 검색 -≫ 응답 생성 -≫ trace 저장` 단계를 두는 방향으로 설계했습니다. 저는 이처럼 문제를 구조로 다시 정리하고, 그 구조가 실제로 돌아가게 만드는 방식으로 기여할 수 있습니다.
동기 및 포부
저는 AI를 단순히 새로운 기능을 붙이는 수단으로 보지 않습니다. 실제 사용자 문제를 해결하려면 입력이 어떤 상태를 만들고, 그 상태가 어떤 판단과 분기로 이어지며, 마지막에 어떤 결과와 검증 구조를 남겨야 하는지까지 설계해야 한다고 생각합니다. 그래서 저는 AI Agent Engineer, AI Product Engineer, AI Researcher 직무를 따로 떨어진 길로 보지 않고, 같은 문제를 다른 깊이와 관점으로 다루는 역할이라고 생각합니다.

제가 하고 싶은 일은 모델을 한 번 연결해 보는 일이 아니라, 실제로 돌아가고 다시 고칠 수 있는 구조를 만드는 일입니다. `trade-onboarding-agent`에서는 세션과 라우팅을 다루며 맥락을 이어받는 구조를 만들었고, `LGEA`에서는 평가 가능한 실험 구조를 만들었고, `poketdogam`에서는 멀티모달 입력과 fallback, trace를 포함한 제품 흐름을 설계했습니다. 이런 경험을 바탕으로 앞으로도 사용자 문제를 먼저 이해하고, 그것을 흐름과 기준으로 정리한 뒤, 다시 검증 가능한 AI 시스템으로 연결하는 일을 하고 싶습니다.

입사 후에도 같은 방식으로 기여하겠습니다. 먼저 문제를 빠르게 이해하고, 어디서 시스템이 흔들릴 수 있는지 찾고, 그 지점을 처리 단계와 판단 기준으로 나눈 뒤, 작동하는 구조로 만들겠습니다. 그리고 이전 경력을 억지로 포장하지 않더라도, 창업자와 운영자로서 쌓아 온 책임감, 고객 감각, 문제 구조화 방식이 실제로 도움이 되는 방식으로 증명하겠습니다.
준비 노력
저는 희망 직무를 수행하기 위해 학습과 구현을 분리하지 않고 함께 가져가고 있습니다. SESAC x UPSTAGE 과정에서 Python, SQL, RAG, 프롬프트 엔지니어링, 프로젝트 기반 협업을 학습하고 있고, 동시에 공개 저장소에서 AI Agent, 운영형 백엔드, 평가 구조를 직접 구현하고 있습니다. 단순히 강의를 듣고 끝내지 않기 위해 `trade-onboarding-agent`, `LGEA`, `poketdogam` 같은 프로젝트를 만들며, 실제로 어떤 입력이 어떤 처리 단계로 이어지는지, 어디에 fallback이 필요한지, 무엇을 파일과 trace로 남겨야 하는지를 계속 손으로 다뤘습니다.

또한 학습 내용을 설명 가능한 형태로 남기기 위해 Tokenizer, Transformer 구조, LLM 경량화, Lost in the Middle 같은 주제를 발표 자료로 정리해 왔습니다. 코딩테스트 스터디를 병행하며 문제 해결 기본기를 다지고 있고, POMMIT 활동을 통해 일정 기반 협업과 팀 산출물 생산도 경험하고 있습니다. 저는 준비를 `공부했다`고 쓰기보다, 무엇을 만들었고 어떻게 남겼는지로 보여주고 싶습니다. 그래서 앞으로도 문제를 구조화하고, 구현하고, 다시 검증 가능한 형태로 남기는 방식으로 직무 준비를 이어가겠습니다.
가장 먼저 출근하고, 가장 늦게 퇴근하는 개발자
저는 현재 참여 중인 Upstage 주관 AI Agent 과정에서 스스로 한 가지 원칙을 세웠습니다.
부족한 전공 지식과 실무 역량의 간극을 메우기 위해 누구보다 먼저 강의실 문을 열고, 누구보다 늦게 불을 끄고 퇴근하는 것 입니다.

비전공자로서 AI라는 거대한 벽 앞에 섰을 때, 제가 선택한 전략은 절대적인 시간의 투입이었습니다.
매일 아침 가장 먼저 도착해 전날 배운 기술 스냅샷을 복기하고, 공식 문서와 씨름하며 파이썬과 RAG의 구조를 익혔습니다.
동료들이 퇴근한 뒤에도 홀로 남아 에러 로그를 분석하고 코드의 효율성을 고민하는 이 시간은,
제게 단순한 공부가 아니라 실패하지 않는 비즈니스를 만들기 위한 필수적인 트레이닝입니다.

이러한 태도는 10년 전 한솔교육에서 300%의 성장을 이뤄냈을 때나, 새벽 5시 노원에서 오산까지 통근하며
자가제면 기술을 익혔던 간절함과 결을 같이 합니다. 저는 영리하게 요행을 바라는 사람이 아닙니다.
현장의 문제를 해결하기 위해 필요한 기술이라면, 밤을 새워서라도 내 것으로 만들어 실무에 즉시 적용할 준비가 되어 있습니다.
24시간을 48시간처럼 사용하는 성장 몰입도
저의 하루는 남들보다 일찍 시작되고 가장 늦게 끝납니다. 부족한 전공 지식의 간극을 메우기 위해 세싹(SeSAC) 과정에서
가장 먼저 출근하고 가장 늦게 퇴근하는 교육생을 자처하며 절대적인 학습 시간을 확보하고 있습니다.
하지만 강의실에서의 시간만으로는 충분하지 않다고 판단했습니다.

저는 물리적인 한계를 넘어서기 위해 시간을 쪼개어 다음과 같은 시스템을 스스로 구축했습니다:

-학습 아카이브 개인 프로젝트:
매일 배운 기술적 난제와 해결 과정을 기록하며, 지식을 휘발시키지 않고 자산화하는 개인 프로젝트를 진행 중입니다.

- 공모전 및 주말 스터디:
마이크로소프트 해커톤 일정을 기반으로 실전 프로젝트를 수행하며 공모전 수준의 결과물을 목표로 협업하고 있습니다.
또한 주말에도 쉬지 않고 AI 트렌드와 LLM의 핵심 개념(Tokenizer, Transformer 등)을 심도 있게 연구합니다.

- 코딩테스트 동아리:
엔지니어의 기본기인 알고리즘 역량을 갖추기 위해 주 2회씩 프로그래머스 고득점 킷을 풀이하고, 개인적으로
리트코드를 매일 한 문제씩 풀이하 문제 해결 능력을 연마하고 있습니다.
마무리
이처럼 저는 단순히 교육을 이수하는 것에 그치지 않고, 스스로를 성장의 환경에 강제 노출시키고 있습니다.
10년 전 영업 현장에서 매출을 300% 올렸던 끈기와 , 새벽 5시에 기술을 배우러 통근하던 그 간절함은
현재 AI 엔지니어로 거듭나기 위한 압도적인 몰입으로 이어지고 있습니다.
